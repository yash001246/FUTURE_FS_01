<!--
  Example: how your public website's contact form submits a new lead
  into the CRM. Point the fetch call at your deployed backend URL and
  keep LEAD_INTAKE_KEY on the server side of your website's build
  (e.g. an environment variable), never hard-coded in shipped JS if
  you can avoid it — proxy the submission through your own site's
  server if you want to hide the key entirely.
-->
<form id="contact-form">
  <input name="name" placeholder="Your name" required />
  <input name="email" type="email" placeholder="Your email" required />
  <input name="phone" placeholder="Phone (optional)" />
  <textarea name="message" placeholder="How can we help?"></textarea>
  <button type="submit">Send</button>
</form>

<script>
  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);

    const res = await fetch('https://YOUR-CRM-API-DOMAIN/api/leads/intake', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-intake-key': 'YOUR_LEAD_INTAKE_KEY',
      },
      body: JSON.stringify({
        name: form.get('name'),
        email: form.get('email'),
        phone: form.get('phone'),
        message: form.get('message'),
        source: 'homepage contact form',
      }),
    });

    if (res.ok) {
      e.target.reset();
      alert('Thanks — we\'ll be in touch soon.');
    } else {
      alert('Something went wrong. Please try again.');
    }
  });
</script>
